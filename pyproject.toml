[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-hoard"
version = "0.1.0"
description = "Local library of the user's 3D-printable models (STL, 3MF, OBJ): folder scanning, mesh metrics, CPU-rendered thumbnails, duplicates, marketplace listings, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "numpy>=1.26",
  "pillow>=10",
  "trimesh>=4.4",
  "scipy>=1.11",
  "networkx>=3",
  "lxml>=5",
  "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulcan-hoard = "vulcan.__main__:main"

[tool.setuptools.packages.find]
include = ["vulcan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
